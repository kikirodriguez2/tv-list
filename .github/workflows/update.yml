name: Update IPTV playlist

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build plain M3U playlist
        run: |
          python3 - <<'PY'
          import urllib.request
          import re
          from collections import Counter

          sources = [
              ("Turkey", [
                  "https://iptv-org.github.io/iptv/countries/tr.m3u",
                  "https://iptv-org.github.io/iptv/languages/tur.m3u",
              ]),
              ("Azerbaijan", [
                  "https://iptv-org.github.io/iptv/countries/az.m3u",
                  "https://iptv-org.github.io/iptv/languages/aze.m3u",
              ]),
              ("Kazakhstan", [
                  "https://iptv-org.github.io/iptv/countries/kz.m3u",
                  "https://iptv-org.github.io/iptv/languages/kaz.m3u",
              ]),
              ("Kyrgyzstan", [
                  "https://iptv-org.github.io/iptv/countries/kg.m3u",
                  "https://iptv-org.github.io/iptv/languages/kir.m3u",
              ]),
              ("Uzbekistan", [
                  "https://iptv-org.github.io/iptv/countries/uz.m3u",
                  "https://iptv-org.github.io/iptv/languages/uzb.m3u",
              ]),
              ("Turkmenistan", [
                  "https://iptv-org.github.io/iptv/countries/tm.m3u",
                  "https://iptv-org.github.io/iptv/languages/tuk.m3u",
              ]),

              ("Tatarstan", [
                  "https://iptv-org.github.io/iptv/subdivisions/ru-ta.m3u",
                  "https://iptv-org.github.io/iptv/languages/tat.m3u",
              ]),
              ("Bashkortostan", [
                  "https://iptv-org.github.io/iptv/subdivisions/ru-ba.m3u",
                  "https://iptv-org.github.io/iptv/languages/bak.m3u",
              ]),
              ("Sakha Yakutia", [
                  "https://iptv-org.github.io/iptv/subdivisions/ru-sa.m3u",
                  "https://iptv-org.github.io/iptv/languages/sah.m3u",
              ]),
              ("Tuva", [
                  "https://iptv-org.github.io/iptv/subdivisions/ru-ty.m3u",
              ]),
              ("Khakassia", [
                  "https://iptv-org.github.io/iptv/subdivisions/ru-kk.m3u",
              ]),
              ("Altai Republic", [
                  "https://iptv-org.github.io/iptv/subdivisions/ru-al.m3u",
              ]),
              ("Karachay Cherkessia", [
                  "https://iptv-org.github.io/iptv/subdivisions/ru-kc.m3u",
              ]),
              ("Kabardino Balkaria", [
                  "https://iptv-org.github.io/iptv/subdivisions/ru-kb.m3u",
              ]),
              ("Dagestan", [
                  "https://iptv-org.github.io/iptv/subdivisions/ru-da.m3u",
              ]),
              ("Astrakhan", [
                  "https://iptv-org.github.io/iptv/subdivisions/ru-ast.m3u",
              ]),
              ("Altai Krai", [
                  "https://iptv-org.github.io/iptv/subdivisions/ru-alt.m3u",
              ]),
              ("Chechnya", [
                  "https://iptv-org.github.io/iptv/subdivisions/ru-ce.m3u",
              ]),

              ("Xinjiang Turkic", [
                  "https://iptv-org.github.io/iptv/languages/uig.m3u",
              ]),
              ("Khorasani Turkish", [
                  "https://iptv-org.github.io/iptv/languages/kmz.m3u",
              ]),
          ]

          extras = [
              # Turkmenistan
              ("Turkmenistan", "Arkadag TV",
               "https://alpha.tv.online.tm/hls/ch000.m3u8"),
              ("Turkmenistan", "Altyn Asyr",
               "https://alpha.tv.online.tm/hls/ch001.m3u8"),
              ("Turkmenistan", "Yaslyk",
               "https://alpha.tv.online.tm/hls/ch002.m3u8"),
              ("Turkmenistan", "Miras",
               "https://alpha.tv.online.tm/hls/ch003.m3u8"),
              ("Turkmenistan", "Turkmenistan Sport",
               "https://alpha.tv.online.tm/hls/ch004.m3u8"),
              ("Turkmenistan", "Turkmen Owazy",
               "https://alpha.tv.online.tm/hls/ch005.m3u8"),
              ("Turkmenistan", "Ashgabat TV",
               "https://alpha.tv.online.tm/hls/ch006.m3u8"),
              ("Turkmenistan", "Turkmenistan",
               "https://alpha.tv.online.tm/hls/ch007.m3u8"),

              # Tatarstan
              ("Tatarstan", "TNV Planet",
               "https://planeta.mediacdn.ru/cdn/tnvplanet/playlist.m3u8"),
              ("Tatarstan", "TNV Tatarstan",
               "https://rt-vlg-kzn-htlive.cdn.ngenix.net/hls/CH_R01_TNVT/variant.m3u8"),
              ("Tatarstan", "Tatarstan 24",
               "https://rt-vlg-kzn-htlive.cdn.ngenix.net/hls/CH_R02_EFIR24/variant.m3u8"),
              ("Tatarstan", "Shayan TV",
               "https://s45177.cdn.ngenix.net/hls/CH_R03_SHAYNTV/variant.m3u8"),
              ("Tatarstan", "Maidan",
               "https://rt-vlg-kzn-htlive.cdn.ngenix.net/hls/CH_R05_OTT_VLG_KZN_MAIDAN/variant.m3u8"),

              # Bashkortostan
              ("Bashkortostan", "BST",
               "https://bsttv.bonus-tv.ru/cdn/bst/playlist.m3u8"),
              ("Bashkortostan", "Tamyr",
               "https://s45177.cdn.ngenix.net/hls/CH_R03_TAMYRTV/variant.m3u8"),
              ("Bashkortostan", "Kurai TV",
               "https://bsttv.bonus-tv.ru/cdn/kurai/playlist.m3u8"),
              ("Bashkortostan", "Salam",
               "https://bsttv.bonus-tv.ru/cdn/salyam/playlist.m3u8"),

              # Sakha
              ("Sakha Yakutia", "NVK Sakha",
               "https://s34351.cdn.ngenix.net/hls/CH_R03_OTT_DV_YKT_NVC_OTT/variant.m3u8"),

              # Tuva
              ("Tuva", "Tuva 24",
               "https://s93498.cdn.ngenix.net/hls/CH_R01_TUVA24/variant.m3u8"),

              # Khakassia
              ("Khakassia", "RTS Abakan",
               "https://rt-sib-abakan-htlive.cdn.ngenix.net/hls/CH_R01_OTT_SIB_ABAKAN_RTS/variant.m3u8"),
              ("Khakassia", "TV-7 Abakan",
               "https://rt-sib-abakan-htlive.cdn.ngenix.net/hls/CH_R01_TV7/variant.m3u8"),

              # Karachay-Cherkessia
              ("Karachay Cherkessia", "Arkhyz 24 MediaCDN",
               "https://live.mediacdn.ru/sr1/arhis24/playlist.m3u8"),
              ("Karachay Cherkessia", "Arkhyz 24 Yandex",
               "https://strm.yandex.ru/kal/arhyz24/arhyz240.m3u8"),

              # Dagestan
              ("Dagestan", "RGVK Dagestan",
               "https://rt-sth-mahachk-htlive.cdn.ngenix.net/hls/CH_R01_OTT_STH_MAHACHK_DAGESTAN/variant.m3u8"),

              # Altai Krai
              ("Altai Krai", "Katun 24",
               "https://rt-sib-bul-htlive.cdn.ngenix.net/hls/CH_R01_OTT_SIB_BUL_KATUN24/variant.m3u8"),

              # Chechnya
              ("Chechnya", "Grozny",
               "https://cdn-evacoder-tv.facecast.io/evacoder_hls_hi/UUMLQVAYVlZyH14GRENQVV0G/2/1.m3u8"),

              # Xinjiang
              ("Xinjiang Turkic", "Karamay Uyghur",
               "https://klmyzb.rcsxzx.com/hls/klmy2.m3u8"),

              # Khorasan
              ("Khorasani Turkish", "Atrak TV",
               "https://ncdn.telewebion.ir/atrak/live/playlist.m3u8"),
          ]

          output = ["#EXTM3U"]
          seen_urls = set()
          counts = Counter()

          def rewrite_group(extinf, group):
              group = group.replace('"', "")

              if 'group-title="' in extinf:
                  return re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{group}"',
                      extinf
                  )

              comma = extinf.find(",")

              if comma == -1:
                  return extinf

              return (
                  extinf[:comma]
                  + f' group-title="{group}"'
                  + extinf[comma:]
              )

          def add_stream(group, extinf, stream_url):
              stream_url = stream_url.strip()

              if not stream_url.startswith(("http://", "https://")):
                  return

              if stream_url in seen_urls:
                  return

              seen_urls.add(stream_url)
              counts[group] += 1

              output.append(rewrite_group(extinf, group))
              output.append(stream_url)

          def import_playlist(group, url):
              print(f"Downloading {group}: {url}")

              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0",
                          "Accept": "*/*",
                      },
                  )

                  with urllib.request.urlopen(req, timeout=30) as response:
                      text = response.read().decode(
                          "utf-8-sig",
                          errors="replace"
                      )

              except Exception as error:
                  print(f"FAILED: {url}: {error}")
                  return

              lines = text.splitlines()
              i = 0

              while i < len(lines):
                  line = lines[i].strip()

                  if not line.startswith("#EXTINF:"):
                      i += 1
                      continue

                  extinf = line
                  j = i + 1
                  found_stream = None

                  # Ignore any metadata between EXTINF and the URL.
                  while j < len(lines):
                      candidate = lines[j].strip()

                      if candidate.startswith("#EXTINF:"):
                          break

                      if candidate.startswith(("http://", "https://")):
                          found_stream = candidate
                          break

                      j += 1

                  if found_stream:
                      add_stream(group, extinf, found_stream)
                      i = j + 1
                  else:
                      i += 1

          # Add curated streams first.
          for group, name, url in extras:
              add_stream(
                  group,
                  f'#EXTINF:-1 group-title="{group}",{name}',
                  url
              )

          # Add the big source lists.
          for group, urls in sources:
              for url in urls:
                  import_playlist(group, url)

          final_text = "\n".join(output) + "\n"

          with open("playlist.m3u", "w", encoding="utf-8") as f:
              f.write(final_text)

          all_groups = [group for group, _ in sources]

          with open("playlist-stats.txt", "w", encoding="utf-8") as f:
              f.write(f"TOTAL UNIQUE STREAMS: {len(seen_urls)}\n\n")

              for group in all_groups:
                  f.write(f"{group}: {counts[group]}\n")

          print(f"Created {len(seen_urls)} unique streams")
          PY

      - name: Validate plain M3U
        run: |
          if grep -q '^#EXTVLCOPT' playlist.m3u; then
            echo "ERROR: player-specific metadata found"
            exit 1
          fi

          if grep -q 'legacyhls' playlist.m3u; then
            echo "ERROR: legacy HLS links found"
            exit 1
          fi

          echo "Playlist looks clean."

      - name: Save playlist
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add playlist.m3u playlist-stats.txt

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update plain Turkic IPTV playlist"
            git push
          fi
